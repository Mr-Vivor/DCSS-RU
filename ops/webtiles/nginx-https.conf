# Public :443 is handled by the existing TLS/SNI stream proxy, which sends
# unlisted hostnames to this loopback listener with the PROXY protocol.
server {
    listen 80;
    listen [::]:80;
    server_name dungeoncrawl.ru www.dungeoncrawl.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dungeoncrawl.ru/acme;
        default_type text/plain;
    }
    location / {
        return 308 https://dungeoncrawl.ru$request_uri;
    }
}

server {
    listen 127.0.0.1:9443 ssl http2 proxy_protocol;
    server_name www.dungeoncrawl.ru;
    ssl_certificate /etc/letsencrypt/live/dungeoncrawl.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dungeoncrawl.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 308 https://dungeoncrawl.ru$request_uri;
}

server {
    listen 127.0.0.1:9443 ssl http2 proxy_protocol;
    server_name dungeoncrawl.ru;
    ssl_certificate /etc/letsencrypt/live/dungeoncrawl.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dungeoncrawl.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
