server {
    listen 80;
    listen [::]:80;
    server_name wiki.dungeoncrawl.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/wiki.dungeoncrawl.ru/acme;
        default_type text/plain;
    }
    location / { return 308 https://wiki.dungeoncrawl.ru$request_uri; }
}

server {
    # The existing public TLS/SNI router forwards ordinary sites here.
    listen 127.0.0.1:9443 ssl http2 proxy_protocol;
    server_name wiki.dungeoncrawl.ru;
    ssl_certificate /etc/letsencrypt/live/wiki.dungeoncrawl.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wiki.dungeoncrawl.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /srv/dcss-wiki/current;
    index index.php;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /favicon.ico { alias /srv/dcss-wiki/current/resources/dcss/favicon.png; }
    location /wiki/ {
        rewrite ^/wiki/(.*)$ /index.php?title=$1&$args last;
    }
    location / { try_files $uri $uri/ /index.php?$query_string; }

    # Only public entry points may run PHP. Uploaded files are always static.
    location ~ ^/(index|api|load|rest|opensearch_desc|thumb|img_auth)\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/dcss-wiki.sock;
        fastcgi_read_timeout 90s;
    }
    location ~ \.php(?:/|$) { deny all; }
    location ~ ^/(cache|data|maintenance|includes|vendor|tests|mw-config|serialized|sql)(/|$) { deny all; }
    location ~ /\. { deny all; }
    location ~* \.(?:sql|sqlite|sqlite3|log|bak|ya?ml|json\.lock|lock)$ { deny all; }
    location /images/ {
        location ~* \.(?:php|phtml|phar|html|svg)$ { deny all; }
        try_files $uri =404;
        expires 7d;
    }
    location /resources/dcss/ { expires 1h; }
}
