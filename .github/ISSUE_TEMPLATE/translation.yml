name: Ошибка русского перевода
description: Неверное название, падеж или непонятная фраза
title: 'Перевод: '
body:
  - type: input
    id: version
    attributes:
      label: Версия или номер сборки
      placeholder: Ссылка на сборку или начало дампа персонажа
  - type: textarea
    id: actual
    attributes:
      label: Что написано в игре или вики
      description: Скопируйте фразу целиком и кратко опишите ситуацию.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Как лучше написать
      description: Ваш вариант перевода или исправления.
