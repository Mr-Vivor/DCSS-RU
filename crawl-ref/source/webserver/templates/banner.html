<header class="dc-lobby-heading">
  <img class="dc-lobby-emblem" src="{{ static_url('stone_soup_icon-32x32.png') }}" alt="" width="64" height="64">
  <p class="dc-lobby-kicker">Dungeon Crawl Stone Soup</p>
  <h1>Подземелье ждёт</h1>
  <p class="dc-lobby-intro">Русская версия. Один герой, один спуск — и целый мир под землёй.</p>
  {% if username %}
    <p class="dc-lobby-welcome">С возвращением, {{ username }}.</p>
  {% else %}
    <div class="dc-mode-list dc-guest-actions">
      <a class="dc-mode dc-mode-primary" href="#play-dcss-ru"><span class="dc-mode-label">Играть <span class="dc-menu-version"></span></span><span class="dc-mode-detail">Спуститься в Подземелье</span></a>
      <a class="dc-mode" href="#play-tutorial-ru"><span class="dc-mode-label">Обучение <span class="dc-menu-version"></span></span><span class="dc-mode-detail">Первые шаги в игре</span></a>
    </div>
    <p class="dc-lobby-signin">Для игры войдите в аккаунт или зарегистрируйтесь.</p>
  {% end %}
</header>
