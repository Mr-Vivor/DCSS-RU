server {
    listen 80;
    listen [::]:80;
    server_name dungeoncrawl.ru www.dungeoncrawl.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dungeoncrawl.ru/acme;
        default_type text/plain;
    }

    location / {
        default_type text/plain;
        charset utf-8;
        return 503 "DCSS-RU: HTTPS is being prepared. Please try again shortly.\n";
    }
}
